<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="2026.11.15-0743">
<title>Chess Adventure: chess puzzles for little learners</title>
<style>
:root {
  --light: #fff4d9;
  --dark: #7cb782;
  --frame: #8a5a3b;
  --accent: #ff8a3d;
  --ink: #3b2f2f;
  --bs: max(260px, min(94vw, calc(100vh - 270px), 600px));
}
@supports (height: 100dvh) {
  :root { --bs: max(260px, min(94vw, calc(100dvh - 270px), 600px)); }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Trebuchet MS", sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, #bfe6ff 0%, #fff6e0 100%) fixed;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; max-width: 980px; margin: 0 auto; }
header h1 { flex: 1; margin: 0; text-align: center; font-size: clamp(18px, 4.2vw, 30px); }
.btn { font: inherit; font-size: clamp(16px, 3.4vw, 21px); border: 0; border-radius: 999px; padding: 10px 18px;
  background: #fff; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.15); cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.icon { padding: 6px 10px; font-size: 24px; line-height: 1.2; }
.btn.small { font-size: 15px; padding: 8px 14px; }
.btn.on { background: #ffe08a; }
main { max-width: 980px; margin: 0 auto; padding: 0 12px 28px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

.piece { font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols2", "DejaVu Sans", "Arial Unicode MS", serif;
  line-height: 1; display: inline-block; }
.piece.w { color: #fff; text-shadow: -1.5px 0 #2d2d2d, 1.5px 0 #2d2d2d, 0 -1.5px #2d2d2d, 0 1.5px #2d2d2d,
  -1px -1px #2d2d2d, 1px 1px #2d2d2d, -1px 1px #2d2d2d, 1px -1px #2d2d2d, 0 4px 4px rgba(0,0,0,.3); }
.piece.b { color: #1d1d1d; text-shadow: 0 0 3px rgba(255,255,255,.75), 0 4px 4px rgba(0,0,0,.3); }

/* Home */
.hello { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 6px 0 18px; }
.hello .owl { font-size: 64px; cursor: pointer; animation: bob 2.4s ease-in-out infinite; }
.speech { background: #fff; border-radius: 22px; padding: 12px 16px; font-size: clamp(16px, 3.4vw, 21px);
  box-shadow: 0 4px 0 rgba(0,0,0,.1); max-width: 560px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.card { background: #fff; border-radius: 22px; padding: 14px 10px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.12);
  cursor: pointer; position: relative; transition: transform .15s; }
.card:hover { transform: translateY(-3px) rotate(-1deg); }
.card .ic { font-size: 50px; height: 66px; display: flex; align-items: center; justify-content: center; }
.card .ic .piece { font-size: 58px; }
.card .t { font-size: 17px; font-weight: bold; margin: 6px 0 8px; }
.card.locked { filter: grayscale(1); opacity: .55; }
.card.shake { animation: shake .4s; }
.card .badge { position: absolute; top: -10px; right: -6px; font-size: 34px; animation: bob 2s ease-in-out infinite; }
.pips { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.pip { width: 12px; height: 12px; border-radius: 50%; background: #e4e4e4; }
.pip.on { background: #ffc107; }

/* Story */
.story { background: #fff; border-radius: 28px; padding: 22px; max-width: 660px; margin: 10px auto; text-align: center;
  box-shadow: 0 6px 0 rgba(0,0,0,.12); }
.story .hero { font-size: 110px; line-height: 1.15; animation: bob 2.4s ease-in-out infinite; }
.story .hero .piece { font-size: 130px; }
.story .hero .piece.w { text-shadow: -3px 0 #2d2d2d, 3px 0 #2d2d2d, 0 -3px #2d2d2d, 0 3px #2d2d2d, -2px -2px #2d2d2d,
  2px 2px #2d2d2d, -2px 2px #2d2d2d, 2px -2px #2d2d2d, 0 8px 8px rgba(0,0,0,.25); }
.story h2 { margin: 6px 0; font-size: clamp(22px, 5vw, 32px); }
.story p { font-size: clamp(17px, 3.8vw, 23px); line-height: 1.45; }

/* Puzzle screen */
.topline { display: flex; align-items: center; justify-content: space-between; gap: 8px; max-width: var(--bs);
  margin: 0 auto; flex-wrap: wrap; }
.chap { font-weight: bold; font-size: clamp(16px, 3.4vw, 20px); display: flex; align-items: center; gap: 6px; }
.chap .piece { font-size: 30px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15);
  font: inherit; font-size: 13px; cursor: pointer; padding: 0; color: var(--ink); }
.dots button.done { background: #ffd54f; }
.dots button.cur { outline: 3px solid var(--accent); }
.dots button:disabled { opacity: .45; cursor: default; }
.bubble { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 20px; padding: 8px 12px;
  box-shadow: 0 4px 0 rgba(0,0,0,.1); margin: 8px auto 12px; max-width: var(--bs); min-height: 68px; }
.bubble .owl { font-size: 40px; }
.bubble .msg { flex: 1; font-size: clamp(15px, 3.3vw, 20px); line-height: 1.3; }
.boardwrap { position: relative; width: var(--bs); height: var(--bs); margin: 0 auto; }
.board { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
  border: 8px solid var(--frame); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 0 rgba(0,0,0,.18); background: var(--frame); }
.sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.sq.l { background: var(--light); }
.sq.d { background: var(--dark); }
.sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(255, 225, 0, .35); }
.sq.sel::before { content: ""; position: absolute; inset: 0; background: rgba(255, 190, 0, .65); }
.sq.danger::after { content: ""; position: absolute; inset: 0; background: rgba(255, 0, 0, .38); z-index: 2; }
.sq.esc::after { content: ""; position: absolute; inset: 0; background: rgba(0, 120, 255, .38); z-index: 2; }
.sq.hint::after { content: ""; position: absolute; inset: 0; z-index: 4; animation: pulse 1s infinite;
  box-shadow: inset 0 0 0 5px #ffd400, inset 0 0 22px 8px rgba(255, 212, 0, .9); }
.sq .piece { font-size: calc(var(--bs) * 0.094); position: relative; z-index: 5; pointer-events: none; }
.sq .dot { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(40, 110, 255, .55); z-index: 6; pointer-events: none; }
.sq .ring { position: absolute; inset: 5%; border-radius: 50%; border: 5px solid rgba(255, 60, 60, .75); z-index: 6; pointer-events: none; }
.sq .star { font-size: calc(var(--bs) * 0.068); animation: float 1.6s ease-in-out infinite; z-index: 4; pointer-events: none; }
.sq .zz { position: absolute; top: 1px; right: 3px; font-size: calc(var(--bs) * 0.03); z-index: 7; pointer-events: none; }
.sq .coord { position: absolute; font-size: 10px; opacity: .55; pointer-events: none; z-index: 1; font-family: sans-serif; }
.sq .coord.f { bottom: 1px; right: 3px; }
.sq .coord.r { top: 1px; left: 3px; }
.piece.pop { animation: pop .35s; }
.piece.wiggle { animation: wiggle 1.2s ease-in-out infinite; }
.fx { position: absolute; inset: 8px; pointer-events: none; z-index: 20; }
.floater { position: absolute; transform: translate(-50%, -50%); font-size: calc(var(--bs) * 0.06); font-weight: bold;
  animation: floatup 1s forwards; white-space: nowrap; }
.controls { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.info { font-size: 18px; min-width: 100px; text-align: center; }

/* Modal + confetti */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center;
  z-index: 50; padding: 16px; }
.modal { background: #fff; border-radius: 28px; padding: 22px; max-width: 520px; width: 100%; text-align: center; animation: pop .35s; }
.modal .big { font-size: 84px; line-height: 1.1; }
.modal .sticker { font-size: 120px; line-height: 1.1; animation: spin 1.2s ease-out; display: inline-block; }
.modal h2 { margin: 8px 0; font-size: clamp(22px, 5vw, 30px); }
.modal p { font-size: 18px; }
.rating { font-size: 40px; letter-spacing: 4px; }
.confetti { position: fixed; top: -60px; z-index: 60; pointer-events: none; animation: fall linear forwards; }

/* Sticker book + guide */
h2.page { text-align: center; }
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.stk { background: #fff; border-radius: 20px; padding: 12px; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
.stk .s { font-size: 62px; line-height: 1.2; }
.stk.no .s { opacity: .35; }
.stk .n { font-size: 14px; }
.guide { background: #fff; border-radius: 24px; padding: 18px 24px; box-shadow: 0 6px 0 rgba(0,0,0,.1);
  font-family: "Segoe UI", system-ui, sans-serif; user-select: text; -webkit-user-select: text; line-height: 1.55; font-size: 16px; }
.guide h2 { margin-top: 4px; }
.guide h3 { margin: 22px 0 6px; }
.guide table { border-collapse: collapse; width: 100%; font-size: 15px; }
.guide th, .guide td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: left; vertical-align: top; }
.guide th { background: #fff4d9; }
.guide .settings { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.guide .small { font-size: 14px; color: #666; }

/* Seasons and Season 2 extras */
.seasons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 0 0 16px; }
.season { font: inherit; font-size: clamp(15px, 3.2vw, 19px); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
  background: rgba(255,255,255,.6); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.1); }
.season.on { background: #fff; outline: 3px solid var(--accent); }
.season.locked { opacity: .55; }
.season.shake { animation: shake .4s; }
.season .cnt, .season-head .cnt { font-size: .8em; opacity: .7; margin-left: 4px; }
.season-head { margin: 18px 0 10px; text-align: center; }
.guide tr.season-row th { background: #e3f4ff; font-size: 16px; }
.sq .val { position: absolute; left: 5%; bottom: 5%; z-index: 7; pointer-events: none; background: #ffc83d; color: #3b2f2f; border-radius: 999px;
  font: bold calc(var(--bs) * 0.026) / 1.35 "Trebuchet MS", sans-serif; padding: 0 .45em; box-shadow: 0 1px 0 rgba(0,0,0,.25); }

.sq .dot.special { width: 40%; height: 40%; background: rgba(255, 170, 0, .9); box-shadow: 0 0 0 4px rgba(255,255,255,.75); animation: pulse 1.2s infinite; }

/* Moving pieces, Ollie */
.ollie { display: block; overflow: visible; }
.board { touch-action: none; }
.chap { cursor: pointer; }
.ghost { position: absolute; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center;
  z-index: 30; pointer-events: none; }
.ghost .piece, .dragghost .piece { font-size: calc(var(--bs) * 0.094); }
.dragghost { position: fixed; z-index: 70; pointer-events: none; transform: translate(-50%, -60%) scale(1.25); }
.floater { text-shadow: 0 0 4px #fff, 0 2px 0 #fff; z-index: 40; }
.stk { cursor: pointer; }
.stk .s.pop { animation: pop .35s; }
.guide label { display: inline-flex; align-items: center; gap: 6px; }
.guide select { font: inherit; }

@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
@keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8%) scale(1.1); } }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes floatup { to { transform: translate(-50%, -170%); opacity: 0; } }
@keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
@keyframes spin { 0% { transform: scale(0) rotate(-360deg); } 100% { transform: scale(1) rotate(0); } }
</style>
</head>
<body>
<header>
  <button class="btn icon" id="hHome" title="Home">🏠</button>
  <h1>♞ Chess Adventure</h1>
  <button class="btn icon" id="hSound" title="Voice and sounds on/off">🔊</button>
  <button class="btn icon" id="hStick" title="Sticker book">📒</button>
  <button class="btn icon" id="hGuide" title="For grown-ups">👪</button>
</header>
<main id="app"></main>
<script id="engine">
// Tiny chess engine for teaching. Pawns always promote to a queen.
// Castling and en passant only happen when the caller passes castling rights or an en passant square (Season 2).
var Chess = (function () {
  var FILES = 'abcdefgh';
  var KN = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];
  var ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  var DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  var DIRS = { R: ORTH, B: DIAG, Q: ORTH.concat(DIAG), K: ORTH.concat(DIAG) };

  function idx(n) { return (n.charCodeAt(1) - 49) * 8 + (n.charCodeAt(0) - 97); }
  function name(i) { return FILES[i % 8] + ((i >> 3) + 1); }
  function onB(f, r) { return f >= 0 && f < 8 && r >= 0 && r < 8; }
  function isLight(i) { return ((i % 8) + (i >> 3)) % 2 === 1; }
  function fromMap(map) {
    var b = new Array(64).fill(null);
    for (var k in map) b[idx(k)] = map[k];
    return b;
  }

  function pseudoMoves(b, from) {
    var p = b[from];
    if (!p) return [];
    var c = p[0], t = p[1], f = from % 8, r = from >> 3, out = [];
    function push(to) {
      if (b[to] && b[to][1] === 'K') return; // kings are never captured
      out.push({ from: from, to: to, capture: b[to] || null });
    }
    if (t === 'N' || t === 'K') {
      (t === 'N' ? KN : DIRS.K).forEach(function (d) {
        var nf = f + d[0], nr = r + d[1];
        if (!onB(nf, nr)) return;
        var to = nr * 8 + nf;
        if (b[to] && b[to][0] === c) return;
        push(to);
      });
    } else if (t === 'P') {
      var dir = c === 'w' ? 1 : -1, start = c === 'w' ? 1 : 6, r1 = r + dir;
      if (onB(f, r1) && !b[r1 * 8 + f]) {
        push(r1 * 8 + f);
        var r2 = r + 2 * dir;
        if (r === start && onB(f, r2) && !b[r2 * 8 + f]) push(r2 * 8 + f);
      }
      [-1, 1].forEach(function (df) {
        var nf = f + df;
        if (!onB(nf, r1)) return;
        var to = r1 * 8 + nf;
        if (b[to] && b[to][0] !== c) push(to);
      });
    } else {
      DIRS[t].forEach(function (d) {
        var nf = f + d[0], nr = r + d[1];
        while (onB(nf, nr)) {
          var to = nr * 8 + nf;
          if (b[to]) { if (b[to][0] !== c) push(to); break; }
          push(to);
          nf += d[0]; nr += d[1];
        }
      });
    }
    return out;
  }

  // Squares a piece attacks (pawns attack diagonally even when the square is empty).
  function attacks(b, from) {
    var p = b[from], c = p[0], t = p[1], f = from % 8, r = from >> 3, out = [];
    if (t === 'P') {
      var dir = c === 'w' ? 1 : -1;
      [-1, 1].forEach(function (df) { if (onB(f + df, r + dir)) out.push((r + dir) * 8 + f + df); });
      return out;
    }
    if (t === 'N' || t === 'K') {
      (t === 'N' ? KN : DIRS.K).forEach(function (d) { if (onB(f + d[0], r + d[1])) out.push((r + d[1]) * 8 + f + d[0]); });
      return out;
    }
    DIRS[t].forEach(function (d) {
      var nf = f + d[0], nr = r + d[1];
      while (onB(nf, nr)) {
        var to = nr * 8 + nf;
        out.push(to);
        if (b[to]) break;
        nf += d[0]; nr += d[1];
      }
    });
    return out;
  }

  function attackers(b, sq, byColor) {
    var res = [];
    for (var i = 0; i < 64; i++) {
      if (b[i] && b[i][0] === byColor && attacks(b, i).indexOf(sq) >= 0) res.push(i);
    }
    return res;
  }
  function isAttacked(b, sq, byColor) { return attackers(b, sq, byColor).length > 0; }
  function kingSq(b, c) { return b.indexOf(c + 'K'); }
  function other(c) { return c === 'w' ? 'b' : 'w'; }
  function inCheck(b, c) { var k = kingSq(b, c); return k >= 0 && isAttacked(b, k, other(c)); }

  var VALUE = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 0 };

  function makeMove(b, m) {
    var nb = b.slice(), p = nb[m.from];
    nb[m.from] = null;
    var last = p[0] === 'w' ? 7 : 0;
    nb[m.to] = (p[1] === 'P' && (m.to >> 3) === last) ? p[0] + 'Q' : p;
    if (m.castle) { nb[m.rookTo] = nb[m.rookFrom]; nb[m.rookFrom] = null; }
    if (m.ep != null) nb[m.ep] = null;
    return nb;
  }
  function isLegal(b, m) { return !inCheck(makeMove(b, m), b[m.from][0]); }

  // Castling: the King steps two squares toward a Rook and the Rook hops over him.
  // rights = { k: kingside allowed, q: queenside allowed }; both pieces must still be on their start squares.
  function castleMoves(b, c, rights) {
    var out = [], r = c === 'w' ? 0 : 7, e = r * 8 + 4, opp = other(c);
    if (!rights || b[e] !== c + 'K' || inCheck(b, c)) return out;
    [['k', 7, [5, 6], [5, 6], 6, 5], ['q', 0, [1, 2, 3], [3, 2], 2, 3]].forEach(function (s) {
      var rookSq = r * 8 + s[1];
      if (!rights[s[0]] || b[rookSq] !== c + 'R') return;
      if (s[2].some(function (f) { return b[r * 8 + f]; })) return;
      if (s[3].some(function (f) { return isAttacked(b, r * 8 + f, opp); })) return;
      out.push({ from: e, to: r * 8 + s[4], capture: null, castle: s[0], rookFrom: rookSq, rookTo: r * 8 + s[5] });
    });
    return out;
  }
  // Why a castle is not allowed right now, or '' if it is (or the side has no right).
  function castleBlock(b, c, rights, side) {
    var r = c === 'w' ? 0 : 7, opp = other(c);
    if (!rights || !rights[side] || b[r * 8 + 4] !== c + 'K' || b[r * 8 + (side === 'k' ? 7 : 0)] !== c + 'R') return '';
    if ((side === 'k' ? [5, 6] : [1, 2, 3]).some(function (f) { return b[r * 8 + f]; })) return 'blocked';
    if (inCheck(b, c)) return 'check';
    if ((side === 'k' ? [5, 6] : [3, 2]).some(function (f) { return isAttacked(b, r * 8 + f, opp); })) return 'attacked';
    return '';
  }
  // Castling rights after a move: moving the King loses both, moving a Rook loses its side.
  function moveRights(rights, b, m) {
    if (!rights) return rights;
    var p = b[m.from], r = p[0] === 'w' ? 0 : 7, out = { k: rights.k, q: rights.q };
    if (p[1] === 'K') out.k = out.q = false;
    if (m.from === r * 8 + 7) out.k = false;
    if (m.from === r * 8) out.q = false;
    return out;
  }
  // En passant: right after a pawn jumps two squares, an enemy pawn beside it may eat it as if it had moved one.
  // epSquare(b, m) is the square jumped over (pass it to the next player's legalMoves), or -1.
  function epSquare(b, m) {
    var p = b[m.from];
    return p && p[1] === 'P' && Math.abs(m.to - m.from) === 16 ? (m.from + m.to) / 2 : -1;
  }
  function epMoves(b, c, ep) {
    var out = [];
    if (ep == null || ep < 0 || b[ep]) return out;
    var victim = ep - 8 * (c === 'w' ? 1 : -1), f = ep % 8;
    if (b[victim] !== other(c) + 'P') return out;
    [-1, 1].forEach(function (df) {
      if (f + df < 0 || f + df > 7) return;
      if (b[victim + df] === c + 'P') out.push({ from: victim + df, to: ep, capture: other(c) + 'P', ep: victim });
    });
    return out.filter(function (m) { return isLegal(b, m); });
  }
  function legalMoves(b, c, rights, ep) {
    var out = [];
    for (var i = 0; i < 64; i++) {
      if (b[i] && b[i][0] === c) pseudoMoves(b, i).forEach(function (m) { if (isLegal(b, m)) out.push(m); });
    }
    if (rights) out = out.concat(castleMoves(b, c, rights));
    if (ep != null && ep >= 0) out = out.concat(epMoves(b, c, ep));
    return out;
  }
  function status(b, c) {
    var n = legalMoves(b, c).length, chk = inCheck(b, c);
    if (!n) return chk ? 'checkmate' : 'stalemate';
    return chk ? 'check' : 'ok';
  }

  // Breadth-first search for "stars" and "eat" puzzles (black never moves there).

      var nb = C.makeMove(before, m), promoted = p[1] === 'P' && nb[m.to][1] === 'Q';
      P.board = nb; P.last = m; P.moves++; P.popAt = m.to; P.busy = false;
      P.quiet = (p[1] === 'P' || m.capture) ? 0 : P.quiet + 1;

      else if (m.capture) { sfx('chomp'); floater(m.to, 'Chomp! 😋'); } else if (gotStar >= 0) { sfx('star'); floater(m.to, '+⭐'); } else sfx('move');

  function afterMove(m, p, before, promoted, gotStar) {
    var b = P.board, t = P.type;
    if (t === 'explore') {

      if (promoted) say('Magic! The Pawn became a Queen! ✨ ' + (P.pz.moves - P.moves) + ' more!');

        say('Yum! ' + (left === 1 ? 'One more to eat!' : left + ' more to eat!'));

    }
    if (t === 'safe') {

        say('Yum! But the ' + PNAME[top.capture[1]] + ' was worth more: ' + plural(P.best, 'point') + '! Try again.');
        return revertLater(2400);

      say('Yum! The ' + PNAME[m.capture[1]] + ' is worth ' + plural(got, 'point') + '! 💰', true);

        say('FORK! You attack two pieces at once. Black can only save one!', true);
        return win('Fork! 🍴');

  // A black piece eats the white piece on sq, then the board goes back so the child can try again.
  function punish(sq, text) {
    var b = P.board, att = C.attackers(b, sq, 'b')[0], who = b[att];
    P.danger = [sq]; P.busy = true; drawBoard();
    sfx('oops');
    later(function () {
      animate(att, sq, who, function () {
        P.board = C.makeMove(P.board, { from: att, to: sq }); P.last = { from: att, to: sq }; P.danger = [];
        drawBoard(); sfx('chomp'); floater(sq, 'Chomp!', '#d32f2f');
        say(text(PNAME[who[1]]));
        revertLater(2400, P.pz.text);
      });
    }, 450);
  }

  // Two-step checkmate: a key move, black's reply, then the mate.
  function mate2After(m, before, b) {
    var st = C.status(b, 'b');
    if (st === 'checkmate') {
      P.danger = [C.kingSq(b, 'b')]; drawBoard(); sfx('check'); floater(m.to, 'Checkmate!', '#d32f2f');
      say('CHECKMATE! You thought two steps ahead! 🧠', true);
      return win(P.phase ? 'Checkmate in two steps! 🧠' : 'Checkmate! 🏆');
    }
    if (P.phase === 0 && st !== 'stalemate' && C.isMate2Key(before, m)) {
      P.busy = true; updateInfo();
      say('Clever move! Now black moves…', true);
      later(function () {
        var replies = C.legalMoves(P.board, 'b'), r = pick(replies);
        animate(r.from, r.to, P.board[r.from], function () {
          P.board = C.makeMove(P.board, r); P.last = r; P.popAt = r.to; P.busy = false; P.phase = 1;
          drawBoard(); updateInfo();
          sfx(r.capture ? 'chomp' : 'move');
          say('Black moved. Now find the CHECKMATE!');
        });
      }, 900);
      return;
    }
    P.fails++; sfx('oops');
    if (st === 'stalemate') say('Oops, that\'s a tie! The King can\'t move, but he is not in check. Try again.');
    else if (P.phase === 0) say(st === 'check' ? 'Check! But after that, black can get away. Try another first move!' : 'Hmm, after that black can escape. Try another first move!');
    else if (st === 'check') {
      P.blue = C.legalMoves(b, 'b').map(function (x) { return x.to; }); P.danger = [C.kingSq(b, 'b')]; drawBoard();
      say('Check! But the King can still escape. Find the checkmate!');
    }
    else say('Not checkmate yet. Try again!');
    return revertLater(2600);
  }

  // ---------- Pawn Wars ----------
  function pwWinner(b) {
    if (b.indexOf('wQ') >= 0) return 'w';
    if (b.indexOf('bQ') >= 0) return 'b';
    if (b.indexOf('bP') < 0) return 'w';
    if (b.indexOf('wP') < 0) return 'b';
    return null;
  }
  function passed(b, sq, c) {
    var f = sq % 8, r = sq >> 3, opp = c === 'w' ? 'bP' : 'wP';
    for (var i = 0; i < 64; i++) {
      if (b[i] !== opp || Math.abs((i % 8) - f) > 1) continue;
      if (c === 'w' ? (i >> 3) > r : (i >> 3) < r) return false;
    }
    return true;
  }
  function nearestPawn(b, sq, pawn) {
    var d = 8;
    b.forEach(function (pc, i) { if (pc === pawn) d = Math.min(d, Math.max(Math.abs(i % 8 - sq % 8), Math.abs((i >> 3) - (sq >> 3)))); });
    return d;
  }
  function pwScore(b, m, c, careful) {
    var nb = C.makeMove(b, m), opp = c === 'w' ? 'b' : 'w', p = b[m.from], kings = nb.indexOf(opp + 'K') >= 0;
    if (p[1] === 'P' && nb[m.to][1] === 'Q') return 10000;
    if (kings && C.status(nb, opp) === 'checkmate') return 20000;
    var s = 0;
    if (p[1] === 'K') s = 4 - nearestPawn(nb, m.to, opp + 'P'); // Kings walk toward the enemy Pawns
    else {
      var r = m.to >> 3, prog = c === 'w' ? r : 7 - r;
      s = prog * 2;
      if (passed(nb, m.to, c)) s += 6 + prog * 3;
    }
    if (m.capture) s += 30;
    if (C.isAttacked(nb, m.to, opp)) s -= C.isAttacked(nb, m.to, c) ? 8 : 25;
    if (kings && C.inCheck(nb, opp)) s += 3;
    if (careful) {
      var replies = C.legalMoves(nb, opp, null, P && P.useEp ? C.epSquare(b, m) : -1);
      if (replies.some(function (om) { return nb[om.from][1] === 'P' && C.makeMove(nb, om)[om.to][1] === 'Q'; })) s -= 5000;
      if (kings && replies.some(function (om) { return C.status(C.makeMove(nb, om), c) === 'checkmate'; })) s -= 8000;
      if (kings && !replies.length) s -= 200; // stalemate is only a tie
    }
    return s;
  }
  function pwBest(b, c, careful, noise, ep) {
    var ms = C.legalMoves(b, c, null, ep), best = null, bs = -Infinity;
    ms.forEach(function (m) {
      var s = pwScore(b, m, c, careful) + (Math.random() * 2 - 1) * noise;
      if (s > bs) { bs = s; best = m; }
    });
    return best;
  }
  function computerMove() {
    var b = P.board, gentle = state.settings.ai !== 'tricky';
    if (gentle && Math.random() < 0.3) return pick(C.legalMoves(b, 'b', null, P.ep));
    return pwBest(b, 'b', !gentle, gentle ? 30 : 4, P.ep);
  }
  function pawnWarsAfter(c, m) {
    var b = P.board, w = pwWinner(b);
    if (w) return pawnWarsEnd(w, m.to);
    var nextC = c === 'w' ? 'b' : 'w';
    if (!C.legalMoves(b, nextC, null, P.ep).length) return C.inCheck(b, nextC) ? pawnWarsEnd(c, m.to, 'mate') : pawnWarsEnd('tie', m.to);
    if (P.quiet >= 40) return pawnWarsEnd('tie', m.to, 'quiet');
    if (C.inCheck(b, nextC)) {
      P.danger = [C.kingSq(b, nextC)]; drawBoard(); sfx('check'); floater(C.kingSq(b, nextC), 'Check!', '#d32f2f');
      if (nextC === 'w') say('Check! Your King must step out of danger.');
    } else if (P.danger.length) { P.danger = []; drawBoard(); }
    P.turn = nextC; updateInfo();
    if (nextC === 'b') {
      P.busy = true; updateInfo();
      say(pick(['Hmm, my turn…', 'Let me think…', 'Here I come!']), true);
      later(function () {
        var bm = computerMove();
        animate(bm.from, bm.to, b[bm.from], function () {
          P.quiet = (b[bm.from][1] === 'P' || bm.capture) ? 0 : P.quiet + 1;
          P.ep = P.useEp ? C.epSquare(P.board, bm) : -1;
          P.board = C.makeMove(P.board, bm); P.last = bm; P.popAt = bm.to; P.busy = false;
          drawBoard();
          if (bm.ep != null) { sfx('chomp'); floater(bm.to, 'En passant!', '#d32f2f'); }
          else if (bm.capture) { sfx('chomp'); floater(bm.to, 'Chomp!', '#d32f2f'); } else sfx('move');
          if (!pwWinner(P.board) && C.legalMoves(P.board, 'w', null, P.ep).length) {
            if (P.ep >= 0 && C.epMoves(P.board, 'w', P.ep).length) say('Ooh! That Pawn jumped right past yours. You can eat it en passant, but only right now!');
            else if (bm.ep != null) say('The computer ate your Pawn en passant! Your turn.', true);
            else say(bm.capture ? 'The computer ate one of your Pawns! Your turn.' : P.pz.kings ? 'Your turn! Move a Pawn or your King.' : 'Your turn! Move a white Pawn.', true);
          }
          pawnWarsAfter('b', bm);
        });
      }, 650);
    } else updateInfo();
  }
  function pawnWarsEnd(w, sq, how) {
    P.done = true; state.games++; updateInfo();
    var game = P.ch.title.replace(/^Game: /, '');
    if (w === 'w') {
      state.wins++; save();
      if (how === 'mate') { P.danger = [C.kingSq(P.board, 'b')]; drawBoard(); floater(sq, 'Checkmate!', '#d32f2f'); }
      else if (sq != null && P.board[sq] && P.board[sq][1] === 'Q') floater(sq, '👑 Winner!', '#8a2be2');
      return win((how === 'mate' ? 'Checkmate! ' : '') + 'You won ' + game + '! 🏆');
    }
    save();
    var msg = w === 'b' ? (how === 'mate' ? 'Checkmate! The computer won this time. Good game! Want to play again?' : 'The computer won this time. Good game! Want to play again?')
      : how === 'quiet' ? 'Nobody can win this one. It\'s a tie! Play again?' : 'Stuck! Nobody can move. It\'s a tie! Play again?';
    sfx(w === 'b' ? 'oops' : 'move');
    say(msg);
    later(function () {
      modal('<div class="big">' + (w === 'b' ? '🤖' : '🤝') + '</div><h2>' + (w === 'b' ? 'Good game!' : 'It\'s a tie!') + '</h2><p>' + esc(msg) + '</p>' +
        '<div class="row"><button class="btn primary" id="mAgain">🔁 Play again</button><button class="btn" id="mHome">🏠 Home</button></div>');
      var ci = P.ci, pi = P.pi;
      on('mAgain', function () { startPuzzle(ci, pi); });
      on('mHome', renderHome);
    }, 1200);
  }

  // ---------- hints ----------
  function hintMove() {
    var b = P.board, ms = allMoves();
    if (!ms.length) return null;
    switch (P.type) {
      case 'stars': case 'eat': {
        var r = C.solve(P.pz, b, P.stars, P.promoDone);
        return r && r.first ? r.first : ms[0];
      }
      case 'safe': return ms.find(function (m) { return !threatened(C.makeMove(b, m)).length; }) || ms[0];
      case 'check': return ms.find(function (m) { return C.inCheck(C.makeMove(b, m), 'b'); }) || ms[0];
      case 'mate': return ms.find(function (m) { return C.status(C.makeMove(b, m), 'b') === 'checkmate'; }) || ms[0];
      case 'escape': {
        var atk = C.attackers(b, C.kingSq(b, 'w'), 'b');
        return ms.find(function (m) { return atk.indexOf(m.to) >= 0; }) || ms.find(function (m) { return b[m.from][1] === 'K'; }) || ms[0];
      }
      case 'pawnwars': return pwBest(b, 'w', true, 0, P.ep);
      case 'enpassant': return ms.find(function (m) { return m.ep != null; }) || ms[0];
      case 'bigeat': return ms.filter(function (m) { return m.capture && C.VALUE[m.capture[1]] === P.best; })[0] || ms[0];
      case 'freeeat': return ms.find(function (m) { return m.capture && C.safeLanding(b, m, C.makeMove(b, m)); }) || ms[0];
      case 'fork': return ms.find(function (m) { return C.isFork(C.makeMove(b, m), m, P.pz.targets.map(C.idx)); }) || ms[0];
      case 'promote': { var rp = promoteSearch(b); return rp && rp.first ? rp.first : ms[0]; }
      case 'castle': { var rc = castleSearch(b, P.rights); return rc && rc.first ? rc.first : ms[0]; }
      case 'stalemate': return ms.find(function (m) { return C.status(C.makeMove(b, m), 'b') === 'stalemate'; }) || ms[0];
      case 'mate2': return P.phase ? (C.mateMoves(b, 'w')[0] || ms[0]) : (ms.find(function (m) { return C.isMate2Key(b, m); }) || ms[0]);
      default: return pick(ms);
    }
  }
  function hint() {
    if (!P || P.busy || P.done) return;
    audio(); P.hints++;
    if (P.type === 'tap') { P.hint = P.stars[0]; drawBoard(); say('Look for the glowing square. Tap the star! ⭐'); return; }
    if (P.type === 'meet') {
      for (var i = 0; i < 64; i++) if (P.board[i] && !P.met[i]) { P.hint = i; break; }
      drawBoard(); say('Tap the glowing piece to say hello!'); return;
    }
    var m = hintMove(); if (!m) return;
    P.hintMove = m;
    if (P.sel === m.from) { P.hint = m.to; drawBoard(); say('Now tap the glowing square!'); return; }
    P.sel = null; P.hint = m.from; drawBoard();
    var who = PNAME[P.board[m.from][1]];
    var tips = {
      stars: 'Try the glowing ' + who + '! Then find a dot that gets closer to a star.',
      eat: 'The glowing ' + who + ' can eat something. Tap it!',
      safe: 'Move the glowing ' + who + '. Find a square no black piece can reach.',
      check: 'The glowing ' + who + ' can say "Check!"',
      mate: 'The glowing ' + who + ' can do the checkmate!',
      escape: 'The glowing ' + who + ' can save the King!',
      pawnwars: 'Ollie likes the glowing ' + who + '!',
      bigeat: 'The glowing ' + who + ' can eat the biggest treasure!',
      freeeat: 'The glowing ' + who + ' can eat a piece that has no guard.',
      fork: 'The glowing ' + who + ' can attack two pieces at once!',
      promote: 'Move the glowing ' + who + '. Stay on safe squares!',
      castle: who === 'King' ? 'Tap the glowing King, then the square two steps toward the Rook!' : 'Move the glowing ' + who + ' out of the King\'s way.',
      stalemate: 'The glowing ' + who + ' can make the tie.',
      mate2: P.phase ? 'The glowing ' + who + ' can checkmate now!' : 'Start with the glowing ' + who + '!',
      enpassant: 'The glowing ' + who + ' is right beside the jumper. Tap it, then the gold dot!'
    };
    say(tips[P.type] || 'Tap the glowing ' + who + ', then a blue dot!');
  }

  // ---------- winning ----------
  function rating() {
    var r = 3;
    if (P.par && P.moves > P.par) r = 2;
    if (P.hints || P.fails) r = 2;
    return r;
  }
  function win(extra) {
    P.done = true; P.busy = false; updateInfo();
    var id = P.ch.id, r = rating(), wasDone = chapterDone(P.ci);
    var arr = state.stars[id] || (state.stars[id] = []);
    arr[P.pi] = Math.max(arr[P.pi] || 0, r);
    var finished = chapterDone(P.ci), newSticker = finished && !state.stickers[id];
    if (finished) { state.stickers[id] = true; homeSeason = null; }
    save();
    sfx('win');
    var ci = P.ci, pi = P.pi;
    later(function () {
      var last = pi === P.ch.puzzles.length - 1;
      if (finished && (last || !wasDone)) return chapterModal(ci, newSticker, extra);
      puzzleModal(ci, pi, r, extra);
    }, ONE_MOVE[P.type] ? 1200 : 700);
  }
  function stars(r) { return '⭐'.repeat(r) + '<span style="opacity:.22">' + '⭐'.repeat(3 - r) + '</span>'; }
  function puzzleModal(ci, pi, r, extra) {
    var praise = pick(PRAISE), tip = '';
    if (P.par && P.moves > P.par) tip = 'You did it in ' + plural(P.moves, 'move') + '. Super-star challenge: can you do it in ' + P.par + '?';
    else if (P.hints || P.fails) tip = 'Try it again on your own for 3 stars!';
    var next = pi + 1 < CHAPTERS[ci].puzzles.length ? pi + 1 : firstUndone(ci);
    modal('<div class="big">' + pick(CHEERS) + '</div><h2>' + esc(praise) + '</h2><div class="rating">' + stars(r) + '</div>' +
      (extra ? '<p><b>' + esc(extra) + '</b></p>' : '') + (tip ? '<p>' + esc(tip) + '</p>' : '') +
      '<div class="row"><button class="btn" id="mAgain">🔁 Again</button><button class="btn primary" id="mNext">Next ➡️</button></div>');
    confetti(24);
    speak(praise + (extra ? ' ' + extra : ''));
    on('mAgain', function () { startPuzzle(ci, pi); });
    on('mNext', function () { sfx('tap'); startPuzzle(ci, next); });
  }
  function chapterModal(ci, newSticker, extra) {
    var ch = CHAPTERS[ci], nxt = ci + 1 < CHAPTERS.length ? ci + 1 : -1;
    var line = newSticker ? 'You earned a new sticker!' : 'You finished it again. Hooray!';
    var sn = seasonOf(ci), nextSeason = seasonInfo(sn + 1);
    if (newSticker && seasonDone(sn) && nextSeason) line += ' And you finished ' + seasonInfo(sn).title.split(':')[0] + '! ' + nextSeason.title + ' is open! 🌟';
    modal('<div class="sticker">' + ch.sticker + '</div><h2>Hooray! You finished<br>"' + esc(ch.title) + '"</h2>' +
      (extra ? '<p><b>' + esc(extra) + '</b></p>' : '') + '<p>' + esc(line) + '</p>' +
      '<div class="row"><button class="btn" id="mBook">📒 Sticker book</button>' +
      (nxt >= 0 ? '<button class="btn primary" id="mNext">Next adventure ➡️</button>' : '') +
      '<button class="btn" id="mHome">🏠 Home</button></div>');
    confetti(80);
    speak((extra ? extra + ' ' : '') + 'You finished ' + ch.title.replace(/!$/, '') + '! ' + line);
    on('mBook', renderStickers);
    on('mHome', renderHome);
    on('mNext', function () { renderStory(nxt); });
  }

  // ---------- sticker book ----------
  function renderStickers() {
    leave();
    var have = stickerCount();
    var items = SEASONS.map(function (x) {
      var list = seasonChapters(x.n);
      var got = list.filter(function (ci) { return state.stickers[CHAPTERS[ci].id]; }).length;
      return '<h3 class="season-head">' + x.icon + ' ' + esc(x.title) + ' <span class="cnt">' + got + '/' + list.length + '</span></h3><div class="stickers">' +
        list.map(function (ci) {
          var ch = CHAPTERS[ci], has = !!state.stickers[ch.id];
          return '<div class="stk' + (has ? '' : ' no') + '" data-ci="' + ci + '"><div class="s"' + (has ? '' : ' style="filter:grayscale(1)"') + '>' +
            ch.sticker + '</div><div class="n">' + esc(ch.title) + '</div></div>';
        }).join('') + '</div>';
    }).join('');
    var msg = have === CHAPTERS.length ? 'You collected EVERY sticker! You are a chess champion! 🏆' :
      'You have ' + have + ' of ' + CHAPTERS.length + ' stickers. Finish an adventure to win its sticker!';
    app.innerHTML = '<h2 class="page">📒 My Sticker Book</h2><div class="hello"><div class="owl" id="owl">' + OLLIE + '</div>' +
      '<div class="speech">' + esc(msg) + '</div></div>' + items;
    speak(msg);
    on('owl', function () { speak(msg); });
    app.querySelectorAll('.stk').forEach(function (el) {
      el.addEventListener('click', function () {
        var ch = CHAPTERS[+el.dataset.ci];
        if (state.stickers[ch.id]) {
          var s = el.querySelector('.s'); s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
          sfx('star'); speak(ch.title + '!');
        } else speak('Finish ' + ch.title + ' to get this sticker!');
      });
    });
  }

  // ---------- grown-ups guide ----------
  function renderGuide() {
    leave();
    var s = state.settings;
    var rows = SEASONS.map(function (x) {
      return '<tr class="season-row"><th colspan="3">' + x.icon + ' ' + esc(x.title) + '</th></tr>' + seasonChapters(x.n).map(function (ci) {
        var ch = CHAPTERS[ci], g = GUIDE[ch.id] || ['', ''];
        return '<tr><td>' + ch.icon + ' ' + esc(ch.title) + '</td><td>' + esc(g[0]) + '</td><td>' + esc(g[1]) + '</td></tr>';
      }).join('');
    }).join('');
    app.innerHTML = '<div class="guide"><h2>👪 For grown-ups</h2>' +
      '<p>Chess Adventure teaches the rules of chess in tiny steps, one new idea at a time. Each adventure starts with a short story, then 1 to 6 small puzzles. ' +
      'Ollie the Owl reads everything aloud, so your child doesn\'t need to read.</p>' +
      '<p>Season 1 teaches how every piece moves, capturing, check and checkmate. Season 2 opens after it and builds real playing skills: ' +
      'piece values, safe captures, forks, promotion, castling, en passant, stalemate and two-move checkmates.</p>' +
      '<h3>How to help</h3><ul>' +
      '<li>Sit together. 5 to 10 minutes a day is plenty for a 4-year-old.</li>' +
      '<li>Let them try first. The 💡 Hint button makes the right piece glow. Use it before frustration sets in.</li>' +
      '<li>Praise effort, not stars. Stars only show how many moves were used.</li>' +
      '<li>Play it on a real board too. Moving real pieces helps the rules stick.</li>' +
      '<li>Tap a black piece to see where it can capture (red squares). This helps in the "Watch Out!" adventure.</li></ul>' +
      '<h3>What each adventure teaches</h3><table><tr><th>Adventure</th><th>Your child learns</th><th>Try this together</th></tr>' + rows + '</table>' +
      '<h3>Simplified on purpose</h3><p class="small">Draws by repetition are left out. Castling only appears in "The Castle Move". En passant is taught in "En Passant!" and used in Kings & Pawns; ' +
      'Season 1\'s Pawn Wars leaves it out because it hasn\'t been taught yet. ' +
      'Pawns always become a Queen. Kings are never captured. Pawn Wars: the first pawn to reach the far side wins; if the player to move is stuck, it\'s a tie. ' +
      'Kings & Pawns: make a Queen or checkmate to win; being stuck without check, or 40 moves in a row without a pawn move or capture, is a tie.</p>' +
      '<h3>Settings</h3><div class="settings">' +
      '<label><input type="checkbox" id="gVoice"' + (s.voice ? ' checked' : '') + '> Read aloud</label>' +
      '<label><input type="checkbox" id="gSfx"' + (s.sfx ? ' checked' : '') + '> Sound effects</label>' +
      '<label>Voice speed <select id="gRate"><option value="0.75">Slow</option><option value="0.9">Normal</option><option value="1.05">Quick</option></select></label>' +
      '<label><input type="checkbox" id="gCoords"' + (s.coords ? ' checked' : '') + '> Letters and numbers on the board</label>' +
      '<label><input type="checkbox" id="gUnlock"' + (s.unlockAll ? ' checked' : '') + '> Unlock all adventures</label>' +
      '<label>Pawn Wars computer <select id="gAi"><option value="gentle">Gentle</option><option value="tricky">Tricky</option></select></label>' +
      '</div><p class="small">Progress: ' + plural(stickerCount(), 'sticker') + ', ' + plural(state.wins, 'game win') + '. Saved in this browser only. ' +
      'Version ' + esc(APP_VERSION) + '.</p>' +
      '<div class="row" style="justify-content:flex-start"><button class="btn small" id="gTest">🔊 Test voice</button>' +
      '<button class="btn small" id="gReset">🗑️ Reset progress</button></div></div>';
    $('gRate').value = String(s.rate); if ($('gRate').selectedIndex < 0) $('gRate').value = '0.9';
    $('gAi').value = s.ai;
    function bind(id, key, conv) {
      $(id).addEventListener('change', function (e) { s[key] = conv(e.target); save(); });
    }
    bind('gVoice', 'voice', function (el) { return el.checked; });
    bind('gSfx', 'sfx', function (el) { return el.checked; });
    bind('gRate', 'rate', function (el) { return +el.value; });
    bind('gCoords', 'coords', function (el) { return el.checked; });
    bind('gUnlock', 'unlockAll', function (el) { return el.checked; });
    bind('gAi', 'ai', function (el) { return el.value; });
    on('gTest', function () { audio(); speak('Hi! I\'m Ollie the Owl. Let\'s play chess!'); });
    on('gReset', function () {
      if (!confirm('Erase all stars, stickers and wins?')) return;
      state.stars = {}; state.stickers = {}; state.wins = 0; state.games = 0; save();
      renderGuide();
    });
  }

  renderHome();
})();
</script>
</body>
</html>
